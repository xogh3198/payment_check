name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare download file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk payment-check.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-check-apk
          path: payment-check.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" payment-check.apk \
            --title "Payment Check ${GITHUB_REF_NAME}" \
            --notes "안드로이드 테스트용 APK입니다. 설치 후 알림 접근 권한과 Webhook URL을 설정해 사용합니다."
